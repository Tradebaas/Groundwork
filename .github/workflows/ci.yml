# Groundwork CI: the unbypassable authority. Local hooks are convenience; this is the gate.
# The `stack` skill extends this file with the stack's own gates when the stack is chosen.
name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# The token these jobs receive can read the checkout and nothing else: no job here writes to the
# repository, and a workflow that could would be the first thing a poisoned dependency reaches for.
permissions:
  contents: read

# Every action is pinned to a commit, with its tag beside it for the reader: a tag can be moved to
# other code after review, a sha cannot. Bump both together when updating.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Checks must prove themselves first
        run: |
          node checks/check.test.mjs
          node checks/check-code.test.mjs
          node checks/check-config.test.mjs
          node checks/check-trace.test.mjs
          node checks/check-stack.test.mjs
          node checks/progress.test.mjs
          node checks/progress-work.test.mjs
          node checks/links.test.mjs
          node checks/work.test.mjs
          node checks/board-path.test.mjs
          node checks/board-server.test.mjs
          node checks/board-nav.test.mjs
          node checks/board.test.mjs
          node checks/board-strip.test.mjs
          node checks/board-file.test.mjs
          node checks/guard.test.mjs

      - name: Groundwork checks
        run: node checks/check.mjs

      # --- Stack gates (added by the `stack` skill; keep the order: cheap → expensive) ---
      # - name: Typecheck (strict: the top catcher of AI slips)
      # - name: Lint & format
      # - name: Tests
      # - name: Dependency audit (fail on high/critical)
      # - name: SBOM (top-level dependencies at minimum)
      # - name: License scan
      # - name: Secret scan (gitleaks or equivalent)
      # - name: Build

  # The first mechanical check this framework has ever had on what an interface renders
  # (spec 011). The design method is installed per project and gitignored like a dependency, so
  # this job fetches it at its current release instead of reading it out of the tree. A project
  # on Groundwork with no interface deletes this job; one with more surfaces adds them to the
  # scan. `stack-gates` reads this stage: while .impeccable/config.json declares the method, a
  # workflow has to actually run the detector.
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 is the floor everywhere in this file since 2026-09-06: Node 20 reached end of
          # life on 2026-04-30, and the design method's own `engines.node` asks 22.18 or newer.
          node-version: 22

      # index.html is what this repository publishes. docs/design/reference/ stays out of the
      # scan on purpose: each of its pages mimics one UI library's look so the owner can compare
      # foundations, so a tell there is the file doing its job. Findings that were examined and
      # accepted live with their reason in .impeccable/config.json, which this run reads.
      # Nothing here falls back to green: a detector that cannot install fails the job, because
      # a green tick standing for a scan that never ran is worse than no scan at all.
      - name: The published page carries none of the tells this framework refuses
        run: npx -y impeccable@latest detect index.html

  # Every adoption claim Groundwork makes rests on one walk: a fresh copy reaches a governed
  # first commit without the maintainer. Proving it once by hand dates the evidence; proving it
  # on every push means the green tick beside a commit is the claim, and a broken copy route
  # turns the build red on the commit that broke it. Runbook: docs/operations/evidence-drill.md.
  # The condition keeps it the framework's own business: a project built on Groundwork inherits
  # this job dead rather than inheriting an instruction to delete it.
  drill:
    if: github.repository == 'Tradebaas/Groundwork'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: The drill must prove it can fail
        run: node checks/drill.test.mjs

      # --require-walk: on this repository the drill has no business skipping, so a skip is red
      # here rather than a green tick standing for a walk that never happened.
      - name: A fresh copy still reaches a governed first commit
        run: node checks/drill.mjs --require-walk

  # The local commit-msg hook can be skipped (--no-verify, or a clone that never ran
  # --install-hooks), so the message gate is re-proven here, where it cannot be bypassed.
  trace:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Every commit message passes the gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            node checks/check.mjs --commit-msg "$RUNNER_TEMP/msg" || { echo "  ^ commit $sha"; rc=1; }
          done
          exit $rc

      # Nothing validates the PR body: squash is disabled on this repo (decision 0014), so these
      # commits reach main unchanged and their own trailers are the shipped artifact.
